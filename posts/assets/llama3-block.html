<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✎</text></svg>">
  <style>
    :root {
      --bg-paper: #faf8f5;
      --bg-card: #ffffff;
      --ink: #1f2429;
      --ink-pencil: #525c66;
      --ink-faint: #8c97a4;
      --border-sketch: #2c3238;
      --font-sketch: 'Caveat', cursive;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-paper);
      background-image: radial-gradient(rgba(40, 50, 60, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .nav-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-bar a {
      color: var(--ink-pencil);
      text-decoration: none;
      font-family: var(--font-sketch);
      font-size: 1.25rem;
      font-weight: 600;
      transition: color 0.15s;
    }
    .nav-bar a:hover { color: #000; }

    .sketch-card {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-card);
      border: 2px solid var(--border-sketch);
      border-radius: 8px 16px 6px 14px / 14px 6px 16px 8px;
      box-shadow: 
        4px 5px 0px rgba(30, 35, 42, 0.12),
        10px 20px 35px rgba(0, 0, 0, 0.04);
      padding: 36px 32px 32px;
      position: relative;
    }

    .header-area {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .header-subtitle {
      font-family: var(--font-sketch);
      font-size: 1.3rem;
      color: var(--ink-pencil);
      margin-top: 4px;
    }

    .svg-scroll-container {
      width: 100%;
      overflow-x: auto;
      padding: 6px 0;
    }

    svg.sketch-svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1080px;
      user-select: none;
    }

    .matrix-group {
      transition: transform 0.15s ease, filter 0.15s ease;
      cursor: default;
    }
    .matrix-group:hover {
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.08));
    }

    html.in-iframe body {
      background: transparent;
      min-height: 0;
      padding: 2px 6px 12px 2px;
    }
    html.in-iframe .nav-bar {
      display: none;
    }
  </style>
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('in-iframe');
    }
  </script>
</head>

  <main class="sketch-card">
    <header class="header-area">
      <h1 class="header-title">Anatomy of a Llama 3 Block</h1>
      <p class="header-subtitle">Left: How L blocks stack along the residual stream · Right: Zoomed-in mechanics of Attention (token mixing) vs. FFN (channel mixing)</p>

    <div class="svg-scroll-container">
      <svg class="sketch-svg" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Organic pencil stroke filter -->
          <filter id="roughPencil" x="-4%" y="-4%" width="108%" height="108%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise" seed="12" />

          <pattern id="pBlue" width="5" height="5" patternTransform="rotate(40 0 0)" patternUnits="userSpaceOnUse">

          </pattern>
          <pattern id="pPurple" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">

          <!-- Arrowheads for the architecture diagram -->

          </marker>

            <path d="M 1 2 L 10 6 L 1 10 L 3.5 6 Z" fill="#6d28d9" />
          </marker>
          <marker id="archArrowOrange" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 1 2 L 10 6 L 1 10 L 3.5 6 Z" fill="#c2410c" />
          </marker>
          <marker id="archArrowGreen" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 1 2 L 10 6 L 1 10 L 3.5 6 Z" fill="#15803d" />
          </marker>
        </defs>

        <!-- ============================================================ -->

        <!-- ============================================================ -->
        <g transform="translate(44, 18)">

          <text x="144" y="20" font-family="'Caveat', cursive" font-size="21" font-weight="700" fill="#1e293b">
            Llama 3 Residual Tower
          </text>
        </g>

        <!-- 1. Output Head at Top (y = 60 .. 94) -->
        <g class="matrix-group" transform="translate(120, 60)">
          <rect x="0" y="0" width="220" height="34" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#roughPencil)" />
          <text x="110" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Linear Head (d → Vocab)</text>

        <g class="matrix-group" transform="translate(140, 118)">

        </g>

        <!-- Arrow exiting the Llama 3 Block into Final RMSNorm -->
        <line x1="230" y1="216" x2="230" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#archArrowDark)" />

        <!-- ============================================================ -->
        <!-- THE LLAMA 3 BLOCK (x = 44..434, y = 176..576)                -->
        <!-- ============================================================ -->
        <g>
          <!-- Stacked shadow card behind main block -->

          <!-- Main Block Container -->

          <text x="252" y="235" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#9a3412">x_out = h + FFN(Norm(h))</text>

          <!-- Arrow from SwiGLU FFN to (+) -->
          <line x1="230" y1="270" x2="230" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#archArrowDark)" />

          <!-- SwiGLU Feed-Forward Box (y = 270 .. 314) -->
          <g class="matrix-group" transform="translate(120, 270)">
            <rect x="0" y="0" width="220" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#roughPencil)" />

            <text x="110" y="36" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">per-token MLP (channel mix)</text>

          <!-- Arrow from Pre-FFN RMSNorm to SwiGLU FFN -->
          <line x1="230" y1="334" x2="230" y2="316" stroke="#334155" stroke-width="1.8" marker-end="url(#archArrowDark)" />

          <!-- Pre-FFN RMSNorm (y = 334 .. 364) -->
          <g class="matrix-group" transform="translate(140, 334)">
            <rect x="0" y="0" width="180" height="30" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6" filter="url(#roughPencil)" />
            <text x="90" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">RMSNorm (Pre-FFN)</text>
          </g>

          <!-- Residual Bypass Highway around Sub-layer 2 (left path at x = 86) -->
          <path d="M 230 382 L 86 382 L 86 230 L 211 230" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#archArrowOrange)" />
          <text x="72" y="306" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle" transform="rotate(-90 72 306)">residual (+h)</text>

          <!-- Arrow from Sub-layer 1 (+) up to Pre-FFN RMSNorm -->
          <line x1="230" y1="398" x2="230" y2="366" stroke="#334155" stroke-width="1.8" marker-end="url(#archArrowDark)" />
          <circle cx="230" cy="382" r="3.5" fill="#334155" />

          <!-- ========================================================== -->
          <!-- SUB-LAYER 1 (LOWER): ATTENTION / TOKEN MIXING              -->
          <!-- ========================================================== -->

          <!-- Residual Add (+) Circle for Attention at (230, 412) -->
          <circle cx="230" cy="412" r="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#roughPencil)" />
          <text x="230" y="418" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">+</text>
          <!-- Equation label fits well inside x = 434 (252 + ~140 = 392 < 434) -->
          <text x="252" y="417" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#5b21b6">h = x + Attn(Norm(x))</text>

          <!-- Arrow from GQA Box to (+) -->
          <line x1="230" y1="452" x2="230" y2="430" stroke="#334155" stroke-width="1.8" marker-end="url(#archArrowDark)" />

          <!-- Grouped-Query Attention Box (y = 452 .. 496) -->
          <g class="matrix-group" transform="translate(120, 452)">
            <rect x="0" y="0" width="220" height="44" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#roughPencil)" />
            <rect x="0" y="0" width="220" height="44" rx="6" fill="url(#pPurple)" />
            <text x="110" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#4c1d95" text-anchor="middle">Grouped-Query Attention</text>
            <text x="110" y="36" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">with RoPE &amp; causal mask</text>

          <!-- Arrow from Pre-Attn RMSNorm to GQA Box -->
          <line x1="230" y1="516" x2="230" y2="498" stroke="#334155" stroke-width="1.8" marker-end="url(#archArrowDark)" />

          <!-- Pre-Attn RMSNorm (y = 516 .. 546) -->
          <g class="matrix-group" transform="translate(140, 516)">
            <rect x="0" y="0" width="180" height="30" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6" filter="url(#roughPencil)" />
            <text x="90" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#854d0e" text-anchor="middle">RMSNorm (Pre-Attn)</text>
          </g>

          <!-- Residual Bypass Highway around Sub-layer 1 (left path at x = 86) -->
          <path d="M 230 562 L 86 562 L 86 412 L 211 412" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#archArrowPurple)" />
          <text x="72" y="488" font-family="'Caveat', cursive" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle" transform="rotate(-90 72 488)">residual (+x)</text>

          <!-- Input x split point inside bottom of block -->
          <circle cx="230" cy="562" r="3.5" fill="#334155" />
        </g>

        <!-- Arrow from Token Embeddings up into Pre-Attn RMSNorm -->
        <line x1="230" y1="610" x2="230" y2="548" stroke="#334155" stroke-width="2" marker-end="url(#archArrowDark)" />
        <text x="244" y="598" font-family="'Caveat', cursive" font-size="16" font-weight="700" fill="#1d4ed8">x ∈ ℝ^(N×d)</text>

        <!-- Token Embeddings Box at Bottom (y = 610 .. 646) -->
        <g class="matrix-group" transform="translate(120, 610)">
          <rect x="0" y="0" width="220" height="36" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#roughPencil)" />
          <rect x="0" y="0" width="220" height="36" rx="5" fill="url(#pBlue)" />
          <text x="110" y="23" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">Token Embeddings</text>

        <!-- Input Token IDs label at very bottom -->
        <line x1="230" y1="670" x2="230" y2="649" stroke="#334155" stroke-width="1.6" marker-end="url(#archArrowDark)" />
        <text x="230" y="690" font-family="'Caveat', cursive" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">
          Input Token IDs: ["The", "transformer", "stacks", ...]  (N tokens, d = 4096)
        </text>

        <!-- ============================================================ -->
        <!-- DASHED ZOOM-IN CALLOUT LINES (LEFT STACK → RIGHT PANELS)     -->
        <!-- ============================================================ -->
        <path d="M 340 292 C 425 292, 455 155, 526 155" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#archArrowOrange)" />
        <path d="M 340 474 C 425 474, 455 474, 526 474" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#archArrowPurple)" />

        <!-- ============================================================ -->
        <!-- RIGHT TOP PANEL: INSIDE SWIGLU FEED-FORWARD NETWORK          -->
        <!-- x = 532 .. 1176 (width = 644), y = 24 .. 332 (height = 308)  -->
        <!-- ============================================================ -->
        <g transform="translate(532, 24)">
          <rect x="0" y="0" width="644" height="308" rx="10" fill="#fffaf5" stroke="#ea580c" stroke-width="1.8" filter="url(#roughPencil)" />

          <!-- Header Badge & Concise Title (well within 644px) -->
          <rect x="18" y="14" width="148" height="26" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4" filter="url(#roughPencil)" />

          <text x="178" y="33" font-family="'Caveat', cursive" font-size="20" font-weight="700" fill="#1e293b">

          <!-- Input Node: Norm(h) -->
          <g transform="translate(22, 118)">
            <rect x="0" y="0" width="88" height="40" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6" filter="url(#roughPencil)" />
            <text x="44" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#854d0e" text-anchor="middle">Norm(h)</text>
            <text x="44" y="33" font-family="'Caveat', cursive" font-size="14" fill="#a16207" text-anchor="middle">(N × d)</text>
          </g>

          <!-- Split arrows to Gate and Up branches -->
          <path d="M 110 138 L 132 138 L 132 84 L 158 84" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#archArrowDark)" />
          <path d="M 110 138 L 132 138 L 132 192 L 158 192" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#archArrowDark)" />

          <!-- Upper Branch: W_gate (d -> d_ffn) -->
          <g transform="translate(162, 62)">
            <rect x="0" y="0" width="124" height="44" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#roughPencil)" />
            <text x="62" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#9a3412" text-anchor="middle">Linear W_gate</text>
            <text x="62" y="36" font-family="'Caveat', cursive" font-size="14.5" fill="#c2410c" text-anchor="middle">d → d_ffn</text>
          </g>

          <!-- Arrow from W_gate to SiLU -->
          <line x1="286" y1="84" x2="312" y2="84" stroke="#ea580c" stroke-width="1.6" marker-end="url(#archArrowOrange)" />

          <!-- SiLU Activation Box -->
          <g transform="translate(316, 64)">
            <rect x="0" y="0" width="82" height="40" rx="16" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6" filter="url(#roughPencil)" />

          </g>

          <!-- Lower Branch: W_up (d -> d_ffn) -->
          <g transform="translate(162, 170)">
            <rect x="0" y="0" width="124" height="44" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#roughPencil)" />

          <!-- Converging arrows into Element-wise Multiply (⊙) -->
          <path d="M 398 84 L 434 84 L 434 118" stroke="#c2410c" stroke-width="1.6" fill="none" marker-end="url(#archArrowOrange)" />
          <path d="M 286 192 L 434 192 L 434 158" stroke="#15803d" stroke-width="1.6" fill="none" marker-end="url(#archArrowGreen)" />

          <!-- Element-wise Hadamard Product Circle (⊙) -->
          <circle cx="434" cy="138" r="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2" filter="url(#roughPencil)" />
          <text x="434" y="144" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">⊙</text>
          <text x="434" y="108" font-family="'Caveat', cursive" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">gate</text>

          <!-- Arrow to W_down -->
          <line x1="450" y1="138" x2="482" y2="138" stroke="#334155" stroke-width="1.6" marker-end="url(#archArrowDark)" />

          <!-- Down Projection W_down (d_ffn -> d) -->
          <g transform="translate(486, 116)">
            <rect x="0" y="0" width="132" height="44" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#roughPencil)" />

            <text x="66" y="36" font-family="'Caveat', cursive" font-size="14.5" font-weight="700" fill="#c2410c" text-anchor="middle">d_ffn → d</text>
          </g>

          <!-- Formula & Llama 3 Spec Note at Bottom of FFN Panel (spacious 58px height) -->
          <rect x="22" y="232" width="600" height="58" rx="5" fill="#ffffff" stroke="#fed7aa" stroke-width="1.3" />
          <text x="36" y="254" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#9a3412">
